[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with rate limiting, retries, caching and per-request metrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gateway = "llm_gateway.cli:main"

[project.optional-dependencies]
local = [
    "torch>=2.4",
    "transformers>=4.45",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
